name: CI

on:
  push:
  pull_request:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke-test the CLI
        run: printf "SELL 1 10 LIMIT 100\nBUY 2 4 MARKET\nBOOK\n" | ./build/apex_cli

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAPEX_SANITIZE=ON
      - name: Build
        run: cmake --build build -j --target apex_tests
      - name: Test
        run: ctest --test-dir build --output-on-failure
